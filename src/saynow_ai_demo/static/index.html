<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Say Now AI Demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f3ee;
        --surface: #ffffff;
        --surface-soft: #fff8f1;
        --text: #26211d;
        --muted: #746b61;
        --line: #e1d7ca;
        --orange: #ff8c2e;
        --orange-dark: #d96413;
        --green: #198754;
        --green-soft: #e8f6ef;
        --blue: #2557ff;
        --blue-soft: #edf3ff;
        --red: #b42318;
        --shadow: 0 18px 45px rgba(38, 33, 29, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow-x: hidden;
      }

      button,
      input,
      summary {
        font: inherit;
      }

      button {
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        padding: 0 14px;
      }

      button.primary {
        border-color: var(--orange);
        background: var(--orange);
        color: #ffffff;
        font-weight: 800;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
      }

      .sidebar {
        border-right: 1px solid var(--line);
        padding: 24px;
      }

      .brand {
        display: grid;
        gap: 4px;
        margin-bottom: 28px;
      }

      .brand h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0;
      }

      .brand span,
      .notice {
        color: var(--muted);
        font-size: 14px;
      }

      .status {
        display: grid;
        gap: 12px;
        margin-top: 24px;
      }

      .status-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 10px;
      }

      .status-row dt {
        color: var(--muted);
      }

      .status-row dd {
        min-width: 0;
        margin: 0;
        font-weight: 800;
        overflow-wrap: anywhere;
        text-align: right;
      }

      .main {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto auto;
        min-width: 0;
        gap: 16px;
        padding: 24px;
      }

      .main > * {
        min-width: 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }

      .topbar h2 {
        margin: 0;
        font-size: 22px;
      }

      .mission-strip {
        display: grid;
        gap: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: 14px 16px;
        box-shadow: var(--shadow);
      }

      .mission-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .mission-title strong {
        font-size: 15px;
      }

      .slot-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .slot-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 30px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface-soft);
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        padding: 0 10px;
      }

      .slot-chip.complete {
        border-color: #b9e7c9;
        background: var(--green-soft);
        color: var(--green);
      }

      .conversation {
        display: grid;
        align-content: start;
        gap: 12px;
        min-height: 360px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fffaf4;
        padding: 16px;
      }

      .scenario-preview {
        display: grid;
        gap: 14px;
        width: 100%;
        max-width: 560px;
        margin: auto;
        text-align: center;
      }

      .mascot-mark {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        margin: 0 auto;
        border: 2px solid #111111;
        border-radius: 50%;
        background: #ffffff;
        color: var(--orange-dark);
        font-weight: 900;
      }

      .scenario-preview h3 {
        margin: 0;
        font-size: 24px;
      }

      .scenario-preview p {
        margin: 0;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      .preview-question {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: 12px 14px;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .message {
        max-width: min(760px, 82%);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: 12px 14px;
      }

      .message.user {
        justify-self: end;
        border-color: #ffd2ad;
        background: #fff7ed;
      }

      .message .role {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .message div {
        white-space: pre-line;
      }

      .voice-panel {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) auto minmax(220px, 320px);
        align-items: center;
        gap: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: 16px;
        box-shadow: var(--shadow);
      }

      .voice-copy {
        display: grid;
        gap: 3px;
      }

      .voice-copy span {
        color: var(--orange-dark);
        font-size: 13px;
        font-weight: 900;
      }

      .voice-copy strong {
        font-size: 18px;
      }

      .waveform {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-width: 170px;
        min-height: 56px;
      }

      .waveform span {
        width: 6px;
        height: 18px;
        border-radius: 999px;
        background: #ffd0a8;
      }

      .waveform span:nth-child(2),
      .waveform span:nth-child(8) {
        height: 28px;
      }

      .waveform span:nth-child(3),
      .waveform span:nth-child(7) {
        height: 38px;
        background: var(--orange);
      }

      .waveform span:nth-child(4),
      .waveform span:nth-child(6) {
        height: 48px;
        background: var(--orange-dark);
      }

      .waveform.recording span {
        animation: wave 0.8s ease-in-out infinite;
      }

      .waveform.recording span:nth-child(2n) {
        animation-delay: 0.12s;
      }

      .voice-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .voice-actions .record-button {
        grid-column: 1 / -1;
        min-height: 48px;
        border-color: var(--orange);
        background: var(--orange);
        color: #ffffff;
        font-weight: 900;
      }

      .recording-status {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
        color: var(--muted);
        font-size: 14px;
      }

      .recording-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--muted);
        opacity: 0.45;
      }

      .recording-status.active {
        color: var(--red);
        font-weight: 800;
      }

      .recording-status.active .recording-dot {
        background: var(--red);
        opacity: 1;
        animation: pulse 1s ease-in-out infinite;
      }

      .recording-status.submitting {
        color: var(--orange-dark);
      }

      .recording-status.submitting .recording-dot {
        background: var(--orange);
        opacity: 1;
        animation: pulse 1s ease-in-out infinite;
      }

      .text-fallback {
        grid-column: 1 / -1;
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }

      .text-fallback summary {
        color: var(--muted);
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
      }

      .text-entry {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        margin-top: 10px;
      }

      .text-entry input {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        padding: 0 12px;
      }

      .feedback {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: 16px;
      }

      .feedback h3 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      .feedback-score-band {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }

      .score-tile {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-soft);
        padding: 12px;
      }

      .score-tile strong {
        display: block;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 6px;
      }

      .score-tile div {
        font-size: 24px;
        font-weight: 900;
      }

      .feedback-list {
        display: grid;
        gap: 12px;
      }

      .feedback-card {
        display: grid;
        gap: 10px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }

      .feedback-card header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      .feedback-card strong {
        display: block;
      }

      .score-meter {
        display: grid;
        gap: 6px;
      }

      .meter-track {
        height: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: #ede6dd;
      }

      .meter-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--orange), var(--green));
      }

      .expression {
        border: 1px solid #b9e7c9;
        border-radius: 8px;
        background: var(--green-soft);
        color: var(--green);
        font-weight: 800;
        padding: 10px 12px;
      }

      .feedback-loading {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #f3d8c3;
        border-top-color: var(--orange);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      .ok {
        color: var(--green);
      }

      .error {
        color: var(--red);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }

        50% {
          transform: scale(1.45);
          opacity: 0.55;
        }
      }

      @keyframes wave {
        0%,
        100% {
          transform: scaleY(0.72);
        }

        50% {
          transform: scaleY(1.18);
        }
      }

      @media (max-width: 920px) {
        .shell {
          display: block;
          width: 100%;
          max-width: 100%;
        }

        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .sidebar,
        .main {
          width: 100%;
          max-width: 100%;
          overflow-x: hidden;
        }

        .status-row {
          display: grid;
          grid-template-columns: 1fr;
          gap: 4px;
        }

        .status-row dd {
          max-width: 100%;
          text-align: left;
          word-break: break-all;
        }

        .main {
          display: flex;
          flex-direction: column;
          padding: 18px;
        }

        .mission-strip,
        .conversation,
        .voice-panel,
        .feedback {
          width: 100%;
          max-width: 100%;
        }

        .scenario-preview {
          max-width: 100%;
        }

        .scenario-preview p {
          max-width: 30ch;
          margin: 0 auto;
        }

        .topbar button {
          width: 100%;
        }

        .message {
          max-width: 100%;
        }

        .voice-actions {
          grid-template-columns: 1fr;
        }

        .voice-panel,
        .feedback-score-band {
          grid-template-columns: minmax(0, 1fr);
        }

        .waveform {
          min-width: 0;
        }

        .text-entry {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <h1>Say Now AI Demo</h1>
          <span>말해보고, 통하는지 확인하기</span>
        </div>

        <button class="primary" type="button" onclick="startSession()">
          세션 시작
        </button>

        <dl class="status">
          <div class="status-row">
            <dt>시나리오</dt>
            <dd id="scenarioLabel">cafe_order</dd>
          </div>
          <div class="status-row">
            <dt>세션</dt>
            <dd id="sessionLabel">-</dd>
          </div>
          <div class="status-row">
            <dt>남은 턴</dt>
            <dd id="turnLabel">-</dd>
          </div>
          <div class="status-row">
            <dt>결과</dt>
            <dd id="resultLabel">대기</dd>
          </div>
        </dl>
      </aside>

      <main class="main">
        <header class="topbar">
          <h2>카페에서 주문하기</h2>
          <button id="feedbackButton" type="button" onclick="loadFeedback()" disabled>
            피드백 조회
          </button>
        </header>

        <section id="missionStrip" class="mission-strip" aria-label="mission progress">
          <div class="mission-title">
            <strong>Mission: 카페에서 원하는 음료 주문 성공하기</strong>
            <span id="missionState" class="notice">시작 전</span>
          </div>
          <div id="slotChips" class="slot-chips"></div>
        </section>

        <section id="conversation" class="conversation" aria-live="polite">
          <div id="scenarioPreview" class="scenario-preview">
            <div class="mascot-mark">S</div>
            <h3>지금 말하면 돼요</h3>
            <p>완벽한 문장이 아니어도, 외국인이 이해할지 확인해볼게요.</p>
            <div class="preview-question">
              AI: Hi! What would you like to order?
            </div>
            <button class="primary" type="button" onclick="startSession()">
              카페 주문 시작
            </button>
          </div>
        </section>

        <section id="voicePanel" class="voice-panel">
          <div class="voice-copy">
            <span>say now</span>
            <strong>영어는 기세다. 먼저 말해보세요.</strong>
          </div>

          <div id="waveform" class="waveform" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="voice-actions">
            <button
              id="recordButton"
              class="record-button"
              type="button"
              onclick="startRecording()"
            >
              말하기 시작
            </button>
            <button id="stopButton" type="button" onclick="stopRecording()" disabled>
              제출
            </button>
            <div
              id="recordingStatus"
              class="recording-status"
              aria-live="polite"
            >
              <span class="recording-dot" aria-hidden="true"></span>
              <span id="recordingStatusText">녹음 대기</span>
              <span id="recordingTimer">00:00</span>
            </div>
          </div>

          <details class="text-fallback">
            <summary>텍스트로 입력하기</summary>
            <div class="text-entry">
              <input
                id="textInput"
                type="text"
                placeholder="I want iced latte"
                onkeydown="if (event.key === 'Enter') submitTextTurn()"
              />
              <button type="button" onclick="submitTextTurn()">텍스트 제출</button>
            </div>
          </details>
        </section>

        <section class="feedback">
          <h3>최종 피드백</h3>
          <div id="feedbackBody" class="notice">아직 피드백이 없습니다.</div>
        </section>
      </main>
    </div>

    <script>
      const REQUIRED_SLOTS = [
        { key: "drink", label: "음료" },
        { key: "temperature", label: "온도" },
        { key: "size", label: "사이즈" },
        { key: "for_here_or_to_go", label: "매장/포장" },
      ];

      let sessionId = null;
      let mediaRecorder = null;
      let audioChunks = [];
      let isFeedbackLoading = false;
      let recordingStartedAt = null;
      let recordingTimerId = null;

      renderMissionProgress(REQUIRED_SLOTS.map((slot) => slot.key));

      async function startSession() {
        const { response, body } = await requestJson("/api/sessions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ scenario_id: "cafe_order" }),
        });
        if (!response || !response.ok) {
          appendMessage("system", body.detail || "세션 시작에 실패했습니다.");
          return;
        }

        sessionId = body.session_id;
        document.getElementById("scenarioLabel").textContent = body.scenario_id;
        document.getElementById("sessionLabel").textContent = body.session_id.slice(0, 8);
        document.getElementById("turnLabel").textContent = body.remaining_turns;
        document.getElementById("resultLabel").textContent = "진행 중";
        document.getElementById("missionState").textContent = "진행 중";
        document.getElementById("conversation").innerHTML = "";
        document.getElementById("feedbackBody").className = "notice";
        document.getElementById("feedbackBody").textContent = "아직 피드백이 없습니다.";
        document.getElementById("feedbackButton").disabled = false;
        renderMissionProgress(REQUIRED_SLOTS.map((slot) => slot.key));
        appendMessage("ai", body.assistant_message);
      }

      async function submitTextTurn() {
        if (!ensureSession()) return;
        const input = document.getElementById("textInput");
        const transcript = input.value.trim();
        if (!transcript) return;
        input.value = "";
        await submitTurn("/turns/text", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ transcript }),
        });
      }

      async function startRecording() {
        if (!ensureSession()) return;
        setRecordingStatus("submitting", "마이크 권한 확인 중", false);
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
            },
          });
        } catch (error) {
          setRecordingStatus("idle", "마이크 권한이 필요합니다", false);
          appendMessage("system", `마이크를 사용할 수 없습니다: ${error.message}`);
          return;
        }
        audioChunks = [];
        const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
          ? "audio/webm;codecs=opus"
          : "";
        mediaRecorder = new MediaRecorder(
          stream,
          mimeType ? { mimeType } : undefined
        );
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) audioChunks.push(event.data);
        };
        mediaRecorder.onstop = async () => {
          stopRecordingTimer();
          const blob = new Blob(audioChunks, { type: "audio/webm" });
          stream.getTracks().forEach((track) => track.stop());
          if (!blob.size) {
            setRecordingStatus("idle", "녹음된 음성이 없습니다", false);
            return;
          }
          setRecordingStatus("submitting", "음성 인식 중", false);
          const submitted = await submitAudioBlob(blob);
          setRecordingStatus(
            "idle",
            submitted ? "녹음 대기" : "음성 제출 실패",
            false
          );
        };
        mediaRecorder.start(250);
        document.getElementById("recordButton").disabled = true;
        document.getElementById("stopButton").disabled = false;
        document.getElementById("recordButton").textContent = "녹음 중";
        document.getElementById("waveform").classList.add("recording");
        startRecordingTimer();
      }

      async function stopRecording() {
        if (!mediaRecorder) return;
        mediaRecorder.stop();
        document.getElementById("recordButton").disabled = false;
        document.getElementById("stopButton").disabled = true;
        document.getElementById("recordButton").textContent = "말하기 시작";
        document.getElementById("waveform").classList.remove("recording");
        setRecordingStatus("submitting", "녹음 저장 중", true);
      }

      async function submitAudioBlob(blob) {
        if (!ensureSession()) return false;
        const formData = new FormData();
        formData.append("audio", blob, "recording.webm");
        return await submitTurn("/turns/audio", {
          method: "POST",
          body: formData,
        });
      }

      async function submitTurn(path, options) {
        const { response, body } = await requestJson(
          `/api/sessions/${sessionId}${path}`,
          options
        );
        if (!response || !response.ok) {
          appendMessage("system", body.detail || "턴 제출에 실패했습니다.");
          return false;
        }

        appendMessage("user", body.transcript);
        appendMessage("ai", body.assistant_message);
        renderMissionProgress(body.missing_slots || []);
        document.getElementById("turnLabel").textContent = body.remaining_turns;
        document.getElementById("resultLabel").textContent = body.scenario_result;
        if (body.scenario_result !== "in_progress") {
          document.getElementById("missionState").textContent =
            body.scenario_result === "success" ? "성공" : "실패";
          await loadFeedback({ auto: true });
        }
        return true;
      }

      async function loadFeedback({ auto = false } = {}) {
        if (!ensureSession()) return;
        if (isFeedbackLoading) return;
        setFeedbackLoading(
          auto
            ? "시나리오가 끝났습니다. 최종 피드백 생성 중입니다..."
            : "피드백 생성 중입니다..."
        );
        const { response, body } = await requestJson(
          `/api/sessions/${sessionId}/feedback`
        );
        isFeedbackLoading = false;
        document.getElementById("feedbackButton").disabled = false;
        if (!response || !response.ok) {
          const feedbackBody = document.getElementById("feedbackBody");
          feedbackBody.className = "notice";
          feedbackBody.textContent = body.detail || "피드백 조회에 실패했습니다.";
          return;
        }
        renderFeedback(body);
      }

      function setFeedbackLoading(message) {
        isFeedbackLoading = true;
        document.getElementById("feedbackButton").disabled = true;
        const feedbackBody = document.getElementById("feedbackBody");
        feedbackBody.className = "feedback-loading";
        feedbackBody.innerHTML = `
          <span class="spinner" aria-hidden="true"></span>
          <span>${escapeHtml(message)}</span>
        `;
      }

      function startRecordingTimer() {
        recordingStartedAt = Date.now();
        updateRecordingTimer();
        recordingTimerId = window.setInterval(updateRecordingTimer, 500);
      }

      function stopRecordingTimer() {
        if (recordingTimerId) {
          window.clearInterval(recordingTimerId);
          recordingTimerId = null;
        }
      }

      function updateRecordingTimer() {
        if (!recordingStartedAt) return;
        const elapsedSeconds = Math.floor((Date.now() - recordingStartedAt) / 1000);
        const minutes = String(Math.floor(elapsedSeconds / 60)).padStart(2, "0");
        const seconds = String(elapsedSeconds % 60).padStart(2, "0");
        document.getElementById("recordingTimer").textContent = `${minutes}:${seconds}`;
        setRecordingStatus("active", "녹음 중", true);
      }

      function setRecordingStatus(mode, message, keepTimer) {
        const status = document.getElementById("recordingStatus");
        const statusText = document.getElementById("recordingStatusText");
        status.className = `recording-status ${mode === "idle" ? "" : mode}`;
        statusText.textContent = message;
        if (!keepTimer) {
          document.getElementById("recordingTimer").textContent = "00:00";
          recordingStartedAt = null;
        }
      }

      async function requestJson(url, options) {
        try {
          const response = await fetch(url, options);
          const text = await response.text();
          let body = {};
          if (text) {
            try {
              body = JSON.parse(text);
            } catch {
              body = { detail: text };
            }
          }
          return { response, body };
        } catch (error) {
          return {
            response: null,
            body: { detail: `요청 중 오류가 발생했습니다: ${error.message}` },
          };
        }
      }

      function appendMessage(role, text) {
        const conversation = document.getElementById("conversation");
        const message = document.createElement("div");
        message.className = `message ${role === "user" ? "user" : ""}`;
        const label = document.createElement("span");
        label.className = "role";
        label.textContent = role === "user" ? "사용자" : role === "ai" ? "AI" : "시스템";
        const content = document.createElement("div");
        content.textContent = text;
        message.append(label, content);
        conversation.appendChild(message);
        conversation.scrollTop = conversation.scrollHeight;
      }

      function renderMissionProgress(missingSlots = []) {
        const missing = new Set(missingSlots);
        const chips = REQUIRED_SLOTS.map((slot) => slotChip(slot, !missing.has(slot.key)));
        document.getElementById("slotChips").innerHTML = chips.join("");
      }

      function slotChip(slot, complete) {
        return `
          <span class="slot-chip ${complete ? "complete" : ""}">
            <span>${complete ? "✓" : "·"}</span>
            <span>${slot.label}</span>
          </span>
        `;
      }

      function slotLabel(slot) {
        const labels = {
          drink: "음료",
          size: "사이즈",
          temperature: "온도",
          option: "옵션",
          for_here_or_to_go: "매장/포장",
        };
        return labels[slot] || slot;
      }

      function numberOrZero(value) {
        const number = Number(value);
        return Number.isFinite(number) ? number : 0;
      }

      function renderFeedback(feedback) {
        const body = document.getElementById("feedbackBody");
        const averageDelta = averageScoreDelta(feedback.turn_feedback || []);
        const turns = (feedback.turn_feedback || [])
          .map(
            (turn) => `
              <article class="feedback-card">
                <header>
                  <div>
                    <span class="notice">내 답변</span>
                    <strong>${escapeHtml(turn.user_said)}</strong>
                  </div>
                  <strong class="ok">+${numberOrZero(turn.score_delta)}%</strong>
                </header>
                ${scoreMeter(turn)}
                <div>${escapeHtml(turn.heard_as)}</div>
                <div class="expression">${escapeHtml(expressionMessage(turn))}</div>
                <div class="notice">${escapeHtml(turn.reason)}</div>
              </article>
            `
          )
          .join("");
        body.className = "";
        body.innerHTML = `
          <div id="feedbackScoreBand" class="feedback-score-band">
            <div class="score-tile">
              <strong>Total 이해도</strong>
              <div>${numberOrZero(feedback.total_understood_score)}%</div>
            </div>
            <div class="score-tile">
              <strong>시나리오 결과</strong>
              <div>${escapeHtml(feedback.scenario_result)}</div>
            </div>
            <div class="score-tile">
              <strong>평균 상승폭</strong>
              <div>+${averageDelta}%</div>
            </div>
          </div>
          <h4>대화별 피드백</h4>
          <p>${escapeHtml(feedback.summary)}</p>
          <div class="feedback-list">
            ${turns || '<p class="notice">기록된 발화가 없습니다.</p>'}
          </div>
        `;
      }

      function averageScoreDelta(turns) {
        if (!turns.length) return 0;
        const total = turns.reduce(
          (sum, turn) => sum + numberOrZero(turn.score_delta),
          0
        );
        return Math.round(total / turns.length);
      }

      function scoreMeter(turn) {
        return `
          <div class="score-meter">
            <div class="notice">
              외국인 이해도 ${numberOrZero(turn.understood_score)}% → ${numberOrZero(turn.improved_understood_score)}%
            </div>
            <div class="meter-track">
              <div
                class="meter-fill"
                style="width: ${numberOrZero(turn.improved_understood_score)}%"
              ></div>
            </div>
          </div>
        `;
      }

      function expressionMessage(turn) {
        return (
          turn.display_message ||
          (turn.expression_status === "already_good"
            ? "이미 충분히 자연스럽게 답했어요."
            : `+1 표현: ${turn.better_expression || ""}`)
        );
      }

      function ensureSession() {
        if (sessionId) return true;
        appendMessage("system", "먼저 세션을 시작하세요.");
        return false;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
